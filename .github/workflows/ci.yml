name: Check and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Python syntax
        run: python -m compileall -q src

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test parser
        run: python -m unittest discover -s tests -v

      # Audit the exact packages installed for tests, including transitive dependencies.
      - name: Record installed dependency versions
        run: python -m pip freeze > requirements-audit.txt

      - name: Install security scanner
        run: |
          python -m venv /tmp/pip-audit-env
          /tmp/pip-audit-env/bin/python -m pip install pip-audit

      - name: Check dependencies for known vulnerabilities
        run: /tmp/pip-audit-env/bin/python -m pip_audit --no-deps -r requirements-audit.txt

      - name: Build Docker image
        run: docker build --tag car-scraper:ci .
